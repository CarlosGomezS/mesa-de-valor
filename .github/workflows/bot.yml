name: Mesa de Valor

on:
  schedule:
    # GitHub retrasa o salta muchas ejecuciones programadas; pedirlo cada 10 min hace que en la
    # práctica pase cada 20-60 min. Las pasadas sin nada que hacer no gastan consultas de cuotas.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Buscar apuestas ahora"
        default: "si"

permissions:
  contents: write

concurrency:
  group: mesa
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Recuperar memoria del laboratorio
        continue-on-error: true
        run: |
          if git fetch -q --depth=1 origin lab-data 2>/dev/null; then git show FETCH_HEAD:lab.enc > lab.enc; else echo "El laboratorio aún no tiene memoria"; fi
      - name: Ejecutar
        continue-on-error: true
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then echo "Aún no hay contraseña: termina la configuración desde la web."; exit 0; fi
          python bot/run.py
      - name: Guardar estado
        continue-on-error: true
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add docs/data/state.enc docs/data/diag.txt 2>/dev/null || git add docs/data/state.enc
          git diff --cached --quiet && exit 0
          git commit -m "estado"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: Guardar memoria del laboratorio
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s lab.enc ] || exit 0
          if git fetch -q --depth=1 origin lab-data 2>/dev/null && git show FETCH_HEAD:lab.enc | cmp -s - lab.enc; then echo "Sin cambios"; exit 0; fi
          rm -rf "$RUNNER_TEMP/lab" && mkdir "$RUNNER_TEMP/lab" && cp lab.enc "$RUNNER_TEMP/lab/" && cd "$RUNNER_TEMP/lab"
          git init -q -b lab-data && git add lab.enc
          git -c user.name=mesa-bot -c user.email=mesa-bot@users.noreply.github.com commit -qm "memoria del laboratorio"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lab-data
