name: Mesa de Valor

on:
  schedule:
    # GitHub retrasa o salta muchas ejecuciones programadas; pedirlo cada 10 min hace que en la
    # práctica pase cada 20-60 min. Las pasadas sin nada que hacer no gastan consultas de cuotas.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Buscar apuestas ahora"
        default: "si"

permissions:
  contents: write

concurrency:
  group: mesa
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Ejecutar
        continue-on-error: true
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then echo "Aún no hay contraseña: termina la configuración desde la web."; exit 0; fi
          python bot/run.py
      - name: Guardar estado
        continue-on-error: true
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add docs/data/state.enc
          git diff --cached --quiet && exit 0
          git commit -m "estado"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
