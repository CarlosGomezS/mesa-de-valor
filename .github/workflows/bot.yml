name: Mesa de Valor

on:
  schedule:
    # GitHub solo cumple la programación cada pocas horas: cada ejecución hace pasadas cada 10 min
    # durante 5 h y media y lanza la siguiente (bot/ciclo.sh). La programada queda de reserva.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Buscar apuestas ahora"
        default: "si"

permissions:
  contents: write
  actions: write      # para lanzar el relevo y ver si hay otra ejecución esperando

concurrency:
  group: mesa
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Pasadas cada 10 min (relevo continuo)
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FORZAR: ${{ github.event.inputs.forzar }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then echo "Aún no hay contraseña: termina la configuración desde la web."; exit 0; fi
          bash bot/ciclo.sh
